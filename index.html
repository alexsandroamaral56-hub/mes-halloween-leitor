
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MES Halloween Party - Leitor</title>
<script src="https://unpkg.com/html5-qrcode"></script>
<style>
*{box-sizing:border-box}
body{
  margin:0;padding:20px;
  background:#111;color:#fff;
  font-family:Arial,sans-serif;
  text-align:center
}
.container{max-width:480px;margin:auto}
h1{color:#ff8c00;font-size:27px;margin:12px 0}
.sub{color:#ccc;margin-bottom:22px}
.cards{display:flex;gap:12px;margin:20px 0}
.card{
  flex:1;background:#222;border:1px solid #444;
  border-radius:12px;padding:17px 8px
}
.number{font-size:34px;font-weight:bold;color:#ff8c00}
.card small{color:#ddd}
#reader{
  width:100%;overflow:hidden;
  border-radius:12px;background:#222;margin:18px auto
}
button{
  width:100%;padding:15px;margin:7px 0;
  border:0;border-radius:9px;
  background:#f97316;color:white;
  font-size:16px;font-weight:bold
}
button.stop{background:#555}
input{
  width:100%;padding:15px;border-radius:9px;
  border:1px solid #666;background:#222;color:white;
  font-size:17px;text-transform:uppercase;
  margin:8px 0
}
#resultado{
  padding:18px;margin:16px 0;border-radius:12px;
  background:#292929;font-size:19px;font-weight:bold
}
.ok{background:#075c2d!important}
.repeat{background:#762020!important}
.invalid{background:#704700!important}
.info{color:#bbb;font-size:13px;margin-top:18px}
</style>
</head>
<body>
<div class="container">
  <h1>🎃 MES HALLOWEEN PARTY</h1>
  <div class="sub">Leitor oficial de ingressos individuais</div>

  <div class="cards">
    <div class="card">
      <div class="number" id="usados">—</div>
      <small>Utilizados</small>
    </div>
    <div class="card">
      <div class="number" id="disponiveis">—</div>
      <small>Disponíveis</small>
    </div>
  </div>

  <div id="resultado">Aguardando leitura do ingresso...</div>

  <div id="reader"></div>

  <button onclick="iniciarCamera()">📷 Iniciar câmera</button>
  <button class="stop" onclick="pararCamera()">Parar câmera</button>

  <hr style="border-color:#444;margin:24px 0">

  <input id="codigo" placeholder="MES-HW26-001">
  <button onclick="validarManual()">Validar ingresso</button>

  <div class="info">
    Primeira leitura libera a entrada.<br>
    Segunda leitura bloqueia.
  </div>
</div>

<script>
const API = "COLE_AQUI_O_ENDERECO_EXEC_DO_APPS_SCRIPT";

let leitor = null;
let cameraAtiva = false;
let processando = false;
let ultimoScan = 0;

function chamarAPI(action, params, callback) {
  const nome = "mesCallback" + Date.now() + Math.floor(Math.random()*1000);
  const script = document.createElement("script");
  const query = new URLSearchParams({
    action: action,
    callback: nome,
    ...params
  });

  window[nome] = function(data) {
    callback(data);
    delete window[nome];
    script.remove();
  };

  script.onerror = function() {
    delete window[nome];
    script.remove();
    mostrar("Falha de comunicação. Verifique a internet.", "invalid");
  };

  script.src = API + "?" + query.toString();
  document.body.appendChild(script);
}

function atualizarResumo() {
  chamarAPI("summary", {}, function(data) {
    document.getElementById("usados").textContent = data.usados;
    document.getElementById("disponiveis").textContent = data.disponiveis;
  });
}

function mostrar(texto, classe) {
  const box = document.getElementById("resultado");
  box.className = classe || "";
  box.textContent = texto;
}

function validarCodigo(codigo) {
  if (processando) return;

  codigo = String(codigo || "").trim().toUpperCase();

  if (!codigo) {
    mostrar("Digite ou leia um código.", "invalid");
    return;
  }

  processando = true;
  mostrar("Verificando ingresso...", "");

  chamarAPI("scan", {code: codigo}, function(data) {
    if (data.tipo === "VALIDO") {
      mostrar("✅ ENTRADA LIBERADA! " + data.codigo +
        " • " + data.quando, "ok");
    } else if (data.tipo === "REPETIDO") {
      mostrar("⛔ INGRESSO JÁ UTILIZADO! " + data.codigo +
        " • " + data.quando, "repeat");
    } else {
      mostrar("❌ " + (data.mensagem || "Ingresso inválido"),
        "invalid");
    }

    atualizarResumo();
    document.getElementById("codigo").value = "";

    setTimeout(function() {
      processando = false;
    }, 1500);
  });
}

function validarManual() {
  validarCodigo(document.getElementById("codigo").value);
}

async function iniciarCamera() {
  if (cameraAtiva) return;

  if (!window.isSecureContext) {
    mostrar("Abra o leitor pelo endereço HTTPS do GitHub Pages.", "invalid");
    return;
  }

  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    mostrar("Este navegador não permite acesso à câmera.", "invalid");
    return;
  }

  try {
    leitor = new Html5Qrcode("reader");

    await leitor.start(
      { facingMode: "environment" },
      { fps: 10, qrbox: { width: 240, height: 180 } },
      function(texto) {
        const agora = Date.now();
        if (processando || agora - ultimoScan < 1800) return;
        ultimoScan = agora;
        validarCodigo(texto);
      },
      function() {}
    );

    cameraAtiva = true;
    mostrar("📷 Câmera ativa. Aponte para o QR Code.", "");
  } catch (erro) {
    mostrar("Não foi possível abrir a câmera: " + erro, "invalid");
    leitor = null;
    cameraAtiva = false;
  }
}

async function pararCamera() {
  if (!leitor || !cameraAtiva) return;

  try {
    await leitor.stop();
    await leitor.clear();
  } catch (erro) {}

  leitor = null;
  cameraAtiva = false;
  mostrar("Câmera desligada.", "");
}

atualizarResumo();
</script>
</body>
</html>
